version: 1
formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    level: INFO
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    level: INFO
    filename: logs/pipeline.log
    maxBytes: 1048576
    backupCount: 3
loggers:
  mlpipeline:
    level: INFO
    handlers: [console, file]
    propagate: false
root:
  level: INFO
  handlers: [console, file]
